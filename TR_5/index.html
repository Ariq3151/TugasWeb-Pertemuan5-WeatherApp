<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App - Muhammad Ariq Lubis</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="weather-app">

        <h1>🌤️ Weather App</h1>

        <p class="subtitle">
            Cari informasi cuaca berdasarkan nama kota
        </p>


        

        <form id="searchForm">

            <input
                type="text"
                id="cityInput"
                placeholder="Masukkan nama kota..."
                autocomplete="off"
            >

            <button type="submit">
                🔍 Cari
            </button>

        </form>


        

        <div id="loading" class="hidden">
            ⏳ Memuat data cuaca...
        </div>


        

        <div id="error" class="hidden"></div>


        

        <section id="weatherResult" class="hidden">

            <h2 id="cityName"></h2>

            <img
                id="weatherIcon"
                src=""
                alt="Ikon cuaca"
            >

            <p id="temperature" class="temperature"></p>

            <button id="toggleTemp">
                Ubah ke °F
            </button>

            <p id="description"></p>

            <p id="humidity"></p>

        </section>


        

        <section id="historyContainer">

            <div class="history-header">

                <h3>🕒 Riwayat Pencarian</h3>

                <button id="clearHistory">
                    Hapus Riwayat
                </button>

            </div>

            <ul id="historyList"></ul>

        </section>

    </main>


    <script src="app.js"></script>

</body>
</html>
